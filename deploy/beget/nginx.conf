# Nginx inside the calculator container (behind traefik, which terminates HTTPS).

# At most 10 saves a minute from one visitor (bursts of 5).
limit_req_zone $binary_remote_addr zone=save_calc:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # traefik is the client Nginx sees; take the visitor's real address from it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's internal DNS: re-resolve n8n if its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $n8n_host n8n;

    # Hashed build files never change — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always fresh, so new deploys show up immediately in Telegram.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # "Сохранить расчёт" → n8n webhook over the internal Docker network.
    location = /api/save-calculation {
        limit_req zone=save_calc burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://$n8n_host:5678/webhook/save-calculation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
