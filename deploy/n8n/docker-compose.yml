# n8n for the mortgage bot. Runs next to the static calculator on the same VPS.
# Start:  docker compose up -d      Logs:  docker compose logs -f n8n
# Settings live in .env (copy .env.example and fill it in).

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    restart: unless-stopped
    # Only Nginx on this server talks to n8n; the port is not exposed to the internet.
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      # The workflow reads its settings ($env.*) and checks Telegram signatures with crypto.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Keep the database small: failed runs are kept for a week, successful ones are not stored.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Memory: cap the Node.js heap so n8n fits a small VPS.
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 900m
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
