# Nginx for the mortgage calculator (static files) and n8n (the Telegram bot).
# Copy to /etc/nginx/sites-available/mortgage, replace both domains,
# then: sudo ln -s /etc/nginx/sites-available/mortgage /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS is added afterwards by: sudo certbot --nginx -d your-domain.ru -d n8n.your-domain.ru

# At most 10 saves a minute from one address (bursts of 5): enough for people, not for scripts.
limit_req_zone $binary_remote_addr zone=save_calc:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.ru;

    root /var/www/mortgage;
    index index.html;

    # Hashed build files never change — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh so new deploys show up immediately
    # (Telegram's in-app browser caches aggressively otherwise).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # "Сохранить расчёт": same-origin endpoint, proxied to the n8n webhook.
    location = /api/save-calculation {
        limit_req zone=save_calc burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:5678/webhook/save-calculation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}

# n8n: workflow editor and the webhook Telegram sends bot updates to.
server {
    listen 80;
    listen [::]:80;
    server_name n8n.your-domain.ru;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
