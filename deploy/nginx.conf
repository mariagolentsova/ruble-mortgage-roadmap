# Nginx site for the static mortgage calculator.
# Copy to /etc/nginx/sites-available/mortgage, replace the domain,
# then: sudo ln -s /etc/nginx/sites-available/mortgage /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS is added afterwards by: sudo certbot --nginx -d your-domain.ru

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.ru;

    root /var/www/mortgage;
    index index.html;

    # Hashed build files never change — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh so new deploys show up immediately
    # (Telegram's in-app browser caches aggressively otherwise).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
